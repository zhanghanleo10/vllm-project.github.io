  <title id="t">Ascend NPU P99 latency at batch sizes 1, 4 and 8</title>
  <desc id="d">Horizontal bars compare reported P99 latency on Ascend 910(A2) and Ascend 950 at 1,024 input tokens and beam width 128. Panels show batch sizes 1, 4, and 8. Lower latency is better. The axes span 0 to 200 milliseconds for batch size 1, 0 to 600 for batch size 4, and 0 to 1,800 for batch size 8. On Ascend 910(A2) and Ascend 950, vLLM-GR used catalog constraints. Measurement settings vary across runs.</desc>
