  <title id="t">Ascend NPU P99 latency at batch sizes 1, 4 and 8</title>
  <desc id="d">Horizontal bars compare reported P99 latency on Ascend A2 and A5 at 1,024 input tokens and beam width 256. Panels show batch sizes 1, 4, and 8. Lower latency is better. The batch-size-1 axis spans 0 to 300 milliseconds, and the two larger-batch axes span 0 to 1,800 milliseconds. On Ascend A2 and A5, vLLM-GR and xLLM used catalog constraints. Measurement settings vary across runs.</desc>
